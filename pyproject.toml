[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aor-anc-auto-synthesis"
version = "0.0.1"
description = "Phase 0 consistency audit and IMC-FxLMS baseline reproduction"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.1",
  "PyYAML>=6.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
aor-anc-phase0 = "aor_anc.phase0:main"
aor-anc-phase0-5a = "aor_anc.phase0_5a:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aor_anc"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
